name: Build and Release Mod

on:
  push:
    branches: [ "main" ]
    tags: [ "v*" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Java 8 (Temurin)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '8'

      - name: Make Gradle Wrapper Executable
        run: chmod +x ./gradlew

      - name: Cache Gradle & Minecraft Caches
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Extract Tag Version (if release)
        id: get_version
        run: |
          if [[ "${{ github.ref }}" == refs/tags/v* ]]; then
            VERSION="${GITHUB_REF_NAME#v}"
            echo "BUILD_VERSION=$VERSION" >> $GITHUB_ENV
          else
            echo "BUILD_VERSION=1.0.0-SNAPSHOT" >> $GITHUB_ENV
          fi

      - name: Setup Decomp Workspace
        run: ./gradlew -x getAssets -x getAssetIndex setupDecompWorkspace --no-daemon

      - name: Build Mod JAR
        run: ./gradlew build -x getAssets -x getAssetIndex --no-daemon

      - name: Upload Artifact (on normal push)
        uses: actions/upload-artifact@v4
        with:
          name: offlineskins-jar
          path: build/libs/offlineskins-*.jar

      - name: Create GitHub Release (only on tags)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: build/libs/offlineskins-*.jar
          name: Release v${{ env.BUILD_VERSION }}
          draft: false
          prerelease: false
          generate_release_notes: true